<svg viewBox="0 0 600 620" xmlns="http://www.w3.org/2000/svg" font-family="monospace, sans-serif">

  <defs>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4a5568"/>
    </marker>
    <marker id="arr-y2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f6e05e"/>
    </marker>
    <marker id="arr-p" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#b794f4"/>
    </marker>
  </defs>

  <rect width="600" height="620" fill="#0f1117" rx="12"/>
  <text x="300" y="28" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="bold">Transformer Block — Two Shortcut Connections</text>

  <!-- ── shape annotation helper ── -->
  <!-- shape pill style: fill=#1a202c stroke=#2d3748 -->

  <!-- ══════════════════════════════
       MAIN COLUMN: cx=300
  ══════════════════════════════ -->

  <!-- INPUT -->
  <rect x="210" y="44" width="180" height="30" rx="8" fill="#2d3748" stroke="#68d391" stroke-width="1.5"/>
  <text x="300" y="63" text-anchor="middle" fill="#68d391" font-size="12" font-weight="bold">Input x</text>
  <text x="460" y="63" fill="#718096" font-size="9">(batch, seq, 768)</text>

  <!-- ── SHORTCUT 1 tap point ── -->
  <!-- dot on main line after Input -->
  <line x1="300" y1="74" x2="300" y2="98" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <!-- shortcut_1 label -->
  <circle cx="300" cy="88" r="5" fill="#f6e05e"/>
  <text x="315" y="91" fill="#f6e05e" font-size="9" font-weight="bold">shortcut_1 saved here</text>

  <!-- LAYERNORM 1 -->
  <rect x="210" y="100" width="180" height="30" rx="6" fill="#1a1a2e" stroke="#b794f4" stroke-width="1.5"/>
  <text x="300" y="119" text-anchor="middle" fill="#d6bcfa" font-size="11">LayerNorm 1</text>

  <line x1="300" y1="130" x2="300" y2="148" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- MULTIHEAD ATTENTION -->
  <rect x="188" y="150" width="224" height="36" rx="6" fill="#1a2a4a" stroke="#63b3ed" stroke-width="1.5"/>
  <text x="300" y="166" text-anchor="middle" fill="#90cdf4" font-size="11" font-weight="bold">Multi-Head Attention</text>
  <text x="300" y="179" text-anchor="middle" fill="#718096" font-size="9">12 heads · head_dim=64 · causal mask</text>

  <line x1="300" y1="186" x2="300" y2="204" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- DROPOUT 1 -->
  <rect x="230" y="206" width="140" height="26" rx="6" fill="#2d2418" stroke="#ed8936" stroke-width="1.2"/>
  <text x="300" y="222" text-anchor="middle" fill="#fbd38d" font-size="10">Dropout (p=0.1)</text>

  <line x1="300" y1="232" x2="300" y2="250" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- ADD shortcut_1 -->
  <circle cx="300" cy="262" r="14" fill="#2a2a00" stroke="#f6e05e" stroke-width="2"/>
  <text x="300" y="267" text-anchor="middle" fill="#f6e05e" font-size="14" font-weight="bold">+</text>
  <text x="322" y="266" fill="#f6e05e" font-size="9">add shortcut_1</text>

  <!-- SHORTCUT 1 bypass arrow (left side) -->
  <path d="M210,74 Q120,74 120,160 Q120,262 286,262"
